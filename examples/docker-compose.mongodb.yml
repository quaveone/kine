services:
  mongodb:
    image: mongo:7.0
    container_name: kine-mongodb
    networks:
      - kine-net
    ports:
      - "27017:27017"
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongodb-init:
    image: mongo:7.0
    container_name: kine-mongodb-init
    networks:
      - kine-net
    depends_on:
      mongodb:
        condition: service_healthy
    command:
      - mongosh
      - mongodb://mongodb:27017/admin
      - --eval
      - |
        try {
          rs.status().ok
        } catch (e) {
          rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongodb:27017"}]}).ok
        }

  kine:
    build:
      context: ..
      target: package
    container_name: kine
    networks:
      - kine-net
    ports:
      - "2379:2379"
    command: ["--endpoint", "mongodb://mongodb:27017/kine?replicaSet=rs0"]
    depends_on:
      mongodb-init:
        condition: service_completed_successfully

networks:
  kine-net:
    name: kine-net

volumes:
  mongodb-data:
